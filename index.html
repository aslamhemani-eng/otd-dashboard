<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1e3a5f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OTD">
<title>OTD Dashboard</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="otd-icon-192.png">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#1e3a5f;color:#1d2633;display:flex;align-items:center;justify-content:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom))}
.box{width:100%;max-width:380px;background:#fff;border-radius:18px;padding:30px 24px 24px;box-shadow:0 12px 40px rgba(0,0,0,.28);text-align:center}
.box img{width:84px;height:84px;border-radius:20px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
h1{font-size:19px;line-height:1.3;margin:16px 0 4px;color:#1e3a5f;font-weight:650}
p.sub{margin:0 0 22px;color:#667085;font-size:13.5px}
label.f{display:block;text-align:left;font-size:12px;color:#667085;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
input[type=password]{width:100%;font:inherit;font-size:17px;padding:13px 14px;border:1px solid #d0d5dd;border-radius:10px;outline:none}
input[type=password]:focus{border-color:#2a7f8f;box-shadow:0 0 0 3px rgba(42,127,143,.18)}
.rem{display:flex;align-items:center;gap:10px;margin:14px 0 18px;font-size:14.5px;color:#344054;text-align:left;cursor:pointer;min-height:32px}
.rem input{width:20px;height:20px;accent-color:#1e3a5f;margin:0}
button{width:100%;font:inherit;font-size:16px;font-weight:600;padding:14px;border:0;border-radius:10px;background:#1e3a5f;color:#fff;cursor:pointer;min-height:48px}
button:disabled{opacity:.65;cursor:wait}
.err{min-height:20px;margin-top:12px;color:#b42318;font-size:14px}
.foot{margin-top:14px;font-size:11.5px;color:#98a2b3}
</style>
</head>
<body>
<form class="box" id="f" autocomplete="on">
  <img src="otd-icon-192.png" alt="OTD" width="84" height="84">
  <h1>On Time Development Inc. — Business Dashboard</h1>
  <p class="sub">Private · enter the password to open</p>
  <input type="text" name="username" value="OTD Dashboard" autocomplete="username" hidden>
  <label class="f" for="pw">Password</label>
  <input type="password" id="pw" name="password" autocomplete="current-password" required autofocus>
  <label class="rem"><input type="checkbox" id="rem" checked> Remember on this device</label>
  <button type="submit" id="go">Open</button>
  <div class="err" id="err" role="alert"></div>
  <div class="foot">Encrypted end-to-end · decrypted only on your device</div>
</form>

<script>
(function(){
"use strict";
var KEY_STORE='otd-dash-key-v1';
var P=JSON.parse(document.getElementById('otd-payload').textContent);
function b64d(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function b64e(buf){var u=new Uint8Array(buf),s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
var $=function(id){return document.getElementById(id)};
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
async function derive(pw){
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:b64d(P.salt),iterations:P.iter},base,{name:'AES-GCM',length:256},true,['decrypt']);
}
async function decryptWith(key){
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(P.iv)},key,b64d(P.ct));
  return new TextDecoder().decode(pt);
}
function loaded(){return document.readyState==='complete'?Promise.resolve():new Promise(function(r){window.addEventListener('load',function(){setTimeout(r,0)},{once:true})})}
async function show(html){
  await loaded();  /* never document.open() while the shell is still being parsed */
  document.open();document.write(html);document.close();
}
async function tryStored(){
  try{
    var s=JSON.parse(localStorage.getItem(KEY_STORE)||'null');
    if(!s||s.salt!==P.salt)return false;
    var key=await crypto.subtle.importKey('raw',b64d(s.k),{name:'AES-GCM'},false,['decrypt']);
    var html=await decryptWith(key);await show(html);return true;
  }catch(e){try{localStorage.removeItem(KEY_STORE)}catch(_){}return false}
}
$('f').addEventListener('submit',async function(ev){
  ev.preventDefault();
  var pw=$('pw').value;if(!pw)return;
  $('err').textContent='';$('go').disabled=true;$('go').textContent='Unlocking…';
  var html,key;
  try{key=await derive(pw);html=await decryptWith(key)}
  catch(e){
    $('go').disabled=false;$('go').textContent='Open';
    $('err').textContent=(window.crypto&&crypto.subtle)?'That password didn\u2019t work. Please try again.':'This browser can\u2019t decrypt the dashboard (secure connection required).';
    $('pw').select();return;
  }
  try{
    if($('rem').checked){localStorage.setItem(KEY_STORE,JSON.stringify({salt:P.salt,k:b64e(await crypto.subtle.exportKey('raw',key))}))}
    else localStorage.removeItem(KEY_STORE);
  }catch(e){}
  pw=null;$('pw').value='';
  await show(html);
});
document.documentElement.style.visibility='hidden';
tryStored().then(function(ok){if(!ok){document.documentElement.style.visibility='';$('pw').focus()}});
})();
</script>
